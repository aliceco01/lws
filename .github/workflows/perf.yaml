name: perf-test
on:
  workflow_dispatch:
    inputs:
      only: {description: 'baseline, split, gate or all', default: all}
jobs:
  baseline:
    if: inputs.only == 'all' || inputs.only == 'baseline'
    # Item 2: run the full baseline twice.
    strategy:
      fail-fast: false
      matrix: {attempt: [1, 2]}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version-file: go.mod}
    - run: make test-performance
    - if: always()
      run: cat bin/performance/summary.yaml || true
  split:
    if: inputs.only == 'all' || inputs.only == 'split'
    # Item 4: Hash and Ordinal on their own, same sizes as the baseline.
    strategy:
      fail-fast: false
      matrix: {mode: [hash, ordinal]}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version-file: go.mod}
    - run: make test-performance PERFORMANCE_GENERATOR_CONFIG=$PWD/hack/scratch/configs/${{ matrix.mode }}.yaml PERFORMANCE_RANGESPEC=
    - if: always()
      run: cat bin/performance/summary.yaml || true
  gate:
    if: inputs.only == 'all' || inputs.only == 'gate'
    # Items 1 and 3: gate drop on a live cluster, and who writes the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: {go-version-file: go.mod}
    - run: make kind && bin/kind create cluster --name lws-performance --image kindest/node:v1.37.0 --wait 1m
    - run: make test-performance USE_EXISTING_CLUSTER=true PERFORMANCE_GENERATOR_CONFIG=$PWD/test/performance/configs/smoke/generator.yaml PERFORMANCE_RANGESPEC=
    - run: ARTIFACTS=$PWD/bin hack/scratch/gate-check.sh
    - if: always()
      run: |
        cat bin/gate-check/leader-watch.log || true
        kubectl -n kube-system logs deployment/kwok-controller --tail=200 > bin/kwok.log || true
    - if: always()
      uses: actions/upload-artifact@v4
      with: {name: gate-check, path: bin/gate-check}
